<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Voir l’œuvre sur votre mur · Galerie Artwave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee; --ink: #26231f; --muted: #6b645a; --line: #ddd5c8;
    --accent: #2f2a24; --on-accent: #fbf9f5; --wall: #efe9df;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Hanken Grotesk', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 400 17px/1.55 var(--sans); min-height: 100svh; display: flex; flex-direction: column; }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 16px 24px; }
  .brand { font: 400 15px/1.2 var(--serif); letter-spacing: .02em; color: var(--muted); margin: 0 0 22px; }
  .wall { background: var(--wall); border-radius: 4px; padding: 28px 24px; display: flex; justify-content: center; align-items: center; min-height: 240px; }
  .wall a, .wall img { display: block; }
  .wall img { max-width: 100%; max-height: 46svh; width: auto; height: auto; box-shadow: 0 10px 24px rgba(40, 32, 20, .18), 0 1px 3px rgba(40, 32, 20, .2); }
  h1 { font: 400 32px/1.15 var(--serif); margin: 22px 0 4px; }
  .meta { color: var(--muted); margin: 0 0 18px; font-variant-numeric: tabular-nums; }
  .lead { margin: 0 0 20px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; padding: 12px 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 500 17px/1.2 var(--sans); cursor: pointer; text-decoration: none; }
  .btn:focus-visible { outline: 3px solid #8a6d3b; outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .msg { margin: 16px 0 0; color: var(--muted); font-size: 15px; }
  footer { max-width: 560px; margin: 0 auto; padding: 0 16px 28px; width: 100%; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="brand">Galerie Artwave · Anne Turlais</p>
  <div class="wall" data-wall></div>
  <h1 data-title>Voir l’œuvre sur votre mur</h1>
  <p class="meta" data-meta></p>
  <p class="lead" data-lead>Visez le mur où vous l’imaginez. L’œuvre y apparaîtra à sa taille réelle, et vous pourrez la déplacer du doigt.</p>
  <button type="button" class="btn" data-go hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
    Placer l’œuvre sur mon mur
  </button>
  <p class="msg" data-msg role="status" aria-live="polite"></p>
</main>
<footer><a href="https://galerie-artwave.fr/">galerie-artwave.fr</a></footer>
<script src="ar.js"></script>
</body>
</html>
